name: Release

# A release is built here and not on the machine of a developer, so that its files come with an attestation:
# a signed statement of the commit and the workflow they were built from. The zip is what the Chrome Web Store
# takes, and what "Load unpacked" takes after unzipping.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Check that the tag is the version in package.json
        run: test "$(jq -r .version package.json)" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run zip
      - run: node --test --test-concurrency=1 e2e/mock.test.ts
      - uses: actions/attest@v4
        with:
          subject-path: gemini-mcp-bridge-extension-${{ github.ref_name }}.zip
      - name: Create the release, with the message of the tag as its notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The checkout has the commit of the tag, but not always its message
          git fetch --force origin "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git tag --list "$GITHUB_REF_NAME" --format="%(contents)" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" "gemini-mcp-bridge-extension-$GITHUB_REF_NAME.zip" \
            --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
